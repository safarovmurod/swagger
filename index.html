<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Карапуз API — учебный REST API интернет-магазина детских товаров: каталог, блог, отзывы, регистрация с загрузкой фото.">
<title>Карапуз API</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!-- Swagger UI лежит в репозитории (assets/swagger), а не на чужом CDN:
     страница открывается даже когда внешние домены недоступны -->
<link rel="stylesheet" href="/assets/swagger/swagger-ui.css">
<style>
  /* Ширина у всей страницы одна, содержимое по центру: у Swagger UI
     по умолчанию 1460px, на широком мониторе строки уезжают к краям. */
  :root { --page: 1100px; }

  body { margin: 0; background: #fafafa; }

  /* Собственная чёрная полоса Swagger UI убрана: она дублировала нашу,
     и наверху стояли две одинаковые тёмные ленты подряд. */
  .swagger-ui .topbar { display: none; }

  .topline-wrap { background: #1b1b1b; }
  .topline {
    max-width: var(--page); margin: 0 auto;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 11px 20px; color: #fff;
    font: 500 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .topline b { font-weight: 700; letter-spacing: -.01em; }
  .topline .dim { color: #9aa0a6; font-weight: 400; }
  .topline a { color: #7fd18b; text-decoration: none; }
  .topline a:hover { text-decoration: underline; }
  .topline .sp { margin-left: auto; }

  /* Вертикальные отступы Swagger UI рассчитаны на страницу во весь экран
     и здесь оказываются слишком большими — ужимаем и отделяем блоки. */
  .swagger-ui .wrapper { max-width: var(--page); padding: 0 20px; }
  .swagger-ui .info { margin: 22px 0 18px; }
  .swagger-ui .info .title { font-size: 30px; margin: 0 0 8px; }
  .swagger-ui .info .description { margin-bottom: 4px; }
  .swagger-ui .scheme-container { margin: 0 0 22px; padding: 14px 0; box-shadow: none; border-bottom: 1px solid #e4e6ea; background: transparent; }
  .swagger-ui section.models { margin-top: 26px; }
  .swagger-ui .opblock-tag { font-size: 21px; margin: 0 0 8px; padding: 12px 16px 12px 0; }
  .swagger-ui .opblock { margin: 0 0 8px; }

  @media (max-width: 640px) {
    .topline { padding: 10px 14px; }
    .topline .sp { margin-left: 0; }
    .swagger-ui .wrapper { padding: 0 12px; }
    .swagger-ui .info .title { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="topline-wrap"><div class="topline">
  <b>Softclub · Карапуз API</b>
  <span class="dim">учебный REST API интернет-магазина детских товаров</span>
  <span class="sp"></span>
  <a href="/docs">Каталог по категориям</a>
  <a href="/api/swagger.json" target="_blank" rel="noopener">swagger.json</a>
  <a href="https://github.com/safarovmurod/swagger" target="_blank" rel="noopener">GitHub</a>
</div></div>

<div id="swagger-ui"></div>

<script src="/assets/swagger/swagger-ui-bundle.js"></script>
<script src="/assets/swagger/swagger-ui-standalone-preset.js"></script>
<script>
window.ui = SwaggerUIBundle({
  url: '/api/swagger.json',
  dom_id: '#swagger-ui',
  deepLinking: true,
  docExpansion: 'none',
  defaultModelsExpandDepth: 0,
  displayRequestDuration: true,
  filter: true,
  tryItOutEnabled: true,
  persistAuthorization: true,
  presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
  plugins: [SwaggerUIBundle.plugins.DownloadUrl],
  layout: 'StandaloneLayout'
});
</script>
</body>
</html>
