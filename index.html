<!DOCTYPE html>

<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="description" content="Карапуз API — REST-интерфейс интернет-магазина детских товаров: категории, подкатегории, товары, отзывы, акции и блог.">
<title>Softclub · Карапуз API</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="mask-icon" href="/favicon.svg" color="#2f5c88">
<style>
/* ========== токены темы ========== */
:root {
  --bg: #f6f7f9;
  --bg-soft: #eef0f4;
  --card: #ffffff;
  --card-hover: #fbfcfd;
  --border: #e3e6ec;
  --border-strong: #d3d8e0;
  --text: #14161a;
  --text-2: #3d434d;
  --muted: #6b7280;
  --muted-2: #8b93a1;
  --chip: #eef1f6;
  --accent: #2f5c88;
  --accent-soft: rgba(47, 92, 136, .1);
  --shadow: 0 1px 2px rgba(16, 20, 28, .05), 0 6px 20px rgba(16, 20, 28, .05);
  --get: #2563eb; --get-bg: rgba(37, 99, 235, .1); --get-br: rgba(37, 99, 235, .28);
  --post: #15803d; --post-bg: rgba(21, 128, 61, .1); --post-br: rgba(21, 128, 61, .28);
  --put: #b45309; --put-bg: rgba(180, 83, 9, .1); --put-br: rgba(180, 83, 9, .28);
  --del: #be123c; --del-bg: rgba(190, 18, 60, .1); --del-br: rgba(190, 18, 60, .28);
  --ok: #15803d; --err: #be123c;
  --j-key: #2563eb; --j-str: #15803d; --j-num: #b45309; --j-bool: #7c3aed; --j-null: #6b7280;
  --radius: 14px;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
html[data-theme="dark"] {
  --bg: #0b0b0c;
  --bg-soft: #121214;
  --card: #131315;
  --card-hover: #17171a;
  --border: #232326;
  --border-strong: #313136;
  --text: #ededef;
  --text-2: #c4c4c9;
  --muted: #8b8b93;
  --muted-2: #6d6d75;
  --chip: #1c1c20;
  --accent: #6aa3dd;
  --accent-soft: rgba(106, 163, 221, .14);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .28);
  --get: #6f9df0; --get-bg: rgba(111, 157, 240, .12); --get-br: rgba(111, 157, 240, .3);
  --post: #57b473; --post-bg: rgba(87, 180, 115, .12); --post-br: rgba(87, 180, 115, .3);
  --ok: #57b473; --err: #e2657c;
  --put: #dba458; --put-bg: rgba(219, 164, 88, .12); --put-br: rgba(219, 164, 88, .3);
  --del: #e2657c; --del-bg: rgba(226, 101, 124, .12); --del-br: rgba(226, 101, 124, .3);
  --j-key: #6f9df0; --j-str: #57b473; --j-num: #dba458; --j-bool: #b28ae6; --j-null: #8b8b93;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* ========== шапка ========== */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding: 12px 20px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(160%) blur(12px);
  -webkit-backdrop-filter: saturate(160%) blur(12px);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark {
  width: 30px; height: 30px; flex: none; border-radius: 9px;
  background: #2f5c88; color: #fff;
  display: grid; place-items: center; box-shadow: var(--shadow);
}
.brand-mark svg { width: 19px; height: 19px; display: block; }
.brand-name {
  font-weight: 650; letter-spacing: -.01em; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.brand-name .dim { color: var(--muted); font-weight: 500; }
.badge-ver {
  font-family: var(--mono); font-size: 11px; letter-spacing: .02em;
  padding: 2px 7px; border-radius: 6px; flex: none;
  background: var(--chip); color: var(--muted); border: 1px solid var(--border);
}
.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }

.seg {
  display: flex; padding: 3px; gap: 2px; border-radius: 10px;
  background: var(--chip); border: 1px solid var(--border);
}
.seg button {
  border: 0; background: transparent; color: var(--muted);
  padding: 4px 11px; border-radius: 7px; cursor: pointer;
  font-size: 12px; font-weight: 600; letter-spacing: .02em;
  transition: background .15s, color .15s;
}
.seg button[aria-pressed="true"] { background: var(--card); color: var(--text); box-shadow: var(--shadow); }
.icon-btn {
  width: 34px; height: 34px; display: grid; place-items: center;
  border-radius: 10px; border: 1px solid var(--border);
  background: var(--chip); color: var(--muted); cursor: pointer;
  transition: color .15s, border-color .15s;
}
.icon-btn:hover { color: var(--text); border-color: var(--border-strong); }
.icon-btn svg { width: 17px; height: 17px; }
html[data-theme="dark"] .i-sun { display: none; }
html:not([data-theme="dark"]) .i-moon { display: none; }

/* ========== контент ========== */
main { max-width: 940px; margin: 0 auto; padding: 44px 20px 96px; }
.intro-head { display: flex; align-items: center; gap: 14px; }
.intro-mark {
  width: 44px; height: 44px; flex: none; border-radius: 13px;
  background: var(--card); border: 1px solid var(--border);
  display: grid; place-items: center; box-shadow: var(--shadow); color: var(--accent);
}
.intro-mark svg { width: 23px; height: 23px; }
h1 { margin: 0; font-size: 30px; line-height: 1.2; letter-spacing: -.025em; font-weight: 680; }
.intro-desc { margin: 14px 0 0; color: var(--muted); max-width: 68ch; }
.meta-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.meta {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 11px; border-radius: 9px; font-size: 12px;
  background: var(--card); border: 1px solid var(--border); color: var(--muted);
}
.meta b { color: var(--text-2); font-weight: 620; }
.meta code { font-family: var(--mono); font-size: 11.5px; color: var(--text-2); }

.toolbar { margin: 30px 0 6px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.search {
  flex: 1 1 240px; min-width: 0; display: flex; align-items: center; gap: 9px;
  padding: 9px 13px; border-radius: 11px;
  background: var(--card); border: 1px solid var(--border);
}
.search svg { width: 15px; height: 15px; color: var(--muted-2); flex: none; }
.search input {
  border: 0; background: transparent; color: var(--text);
  outline: none; width: 100%; font-size: 13.5px;
}
.search input::placeholder { color: var(--muted-2); }
.filter-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.filter-tags button {
  border: 1px solid var(--border); background: var(--card); color: var(--muted);
  padding: 6px 12px; border-radius: 9px; font-size: 12.5px; cursor: pointer;
  transition: color .15s, border-color .15s, background .15s;
}
.filter-tags button:hover { color: var(--text); }
.filter-tags button[aria-pressed="true"] { color: var(--text); border-color: var(--border-strong); background: var(--bg-soft); }

.tag-group { margin-top: 34px; }
.tag-group h2 { margin: 0; font-size: 20px; letter-spacing: -.02em; font-weight: 660; }
.tag-group > p { margin: 5px 0 0; color: var(--muted); font-size: 13.5px; }
.ops { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }

/* ========== карточка эндпоинта ========== */
.op {
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--card); overflow: hidden;
  transition: border-color .15s, background .15s;
}
.op:hover { border-color: var(--border-strong); background: var(--card-hover); }
.op[data-open="true"] { border-color: var(--border-strong); background: var(--card); }
.op-head {
  width: 100%; display: flex; align-items: center; gap: 14px;
  padding: 15px 18px; background: none; border: 0; cursor: pointer; text-align: left;
}
.method {
  flex: none; min-width: 62px; text-align: center;
  font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .06em;
  padding: 4px 8px; border-radius: 7px; border: 1px solid;
}
.method.get { color: var(--get); background: var(--get-bg); border-color: var(--get-br); }
.method.post { color: var(--post); background: var(--post-bg); border-color: var(--post-br); }
.method.put { color: var(--put); background: var(--put-bg); border-color: var(--put-br); }
.method.delete { color: var(--del); background: var(--del-bg); border-color: var(--del-br); }
.op-text { min-width: 0; flex: 1; }
.op-path { display: block; font-family: var(--mono); font-size: 13.5px; color: var(--text); word-break: break-word; }
.op-path .sl { color: var(--muted-2); }
.op-path .seg-b { font-weight: 620; }
.op-path .par {
  background: var(--chip); border: 1px solid var(--border);
  padding: 1px 6px; border-radius: 6px; color: var(--text-2); font-weight: 600;
}
.op-sum { display: block; margin-top: 3px; color: var(--muted); font-size: 13px; }
.chev { flex: none; color: var(--muted-2); transition: transform .2s; }
.chev svg { width: 16px; height: 16px; display: block; }
.op[data-open="true"] .chev { transform: rotate(90deg); }

.op-body {
  border-top: 1px solid var(--border); padding: 18px;
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px;
}
/* дети grid/flex по умолчанию не сжимаются уже min-content — иначе длинный JSON распирает карточку */
.op-body > *, .params, .params > *, .param-row > *, .param-input, .js-result, .js-result > * { min-width: 0; }
.op-desc { margin: 0; color: var(--text-2); font-size: 13.5px; }
.block-title {
  font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
  color: var(--muted-2); margin-bottom: 10px;
}
.params { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.param-row {
  display: grid; grid-template-columns: minmax(150px, 210px) minmax(0, 1fr); gap: 12px; align-items: start;
}
.param-name { font-family: var(--mono); font-size: 12.5px; color: var(--text); padding-top: 8px; }
.param-name .req { color: var(--del); margin-left: 3px; }
.param-meta { display: block; font-family: var(--sans); font-size: 11.5px; color: var(--muted-2); margin-top: 2px; }
.param-input { display: grid; gap: 4px; }
input.field, select.field, textarea.field {
  width: 100%; padding: 8px 11px; border-radius: 9px;
  border: 1px solid var(--border); background: var(--bg-soft); color: var(--text);
  font-family: var(--mono); font-size: 12.5px; outline: none;
  transition: border-color .15s;
}
select.field { font-family: var(--sans); }
input.field:focus, select.field:focus, textarea.field:focus { border-color: var(--accent); }
input.field::placeholder { color: var(--muted-2); }
textarea.field { min-height: 160px; resize: vertical; line-height: 1.5; }
.param-hint { font-size: 12px; color: var(--muted); }

.actions { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }
.btn {
  border: 1px solid transparent; border-radius: 10px; padding: 9px 17px;
  font-size: 13px; font-weight: 600; cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px;
  transition: opacity .15s, background .15s, border-color .15s;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { opacity: .9; }
.btn-ghost { background: var(--chip); border-color: var(--border); color: var(--text-2); }
.btn-ghost:hover { border-color: var(--border-strong); color: var(--text); }
.btn[disabled] { opacity: .55; cursor: progress; }
.hint-inline { font-size: 12px; color: var(--muted-2); }

.req-line {
  max-width: 100%; overflow-wrap: anywhere;
  font-family: var(--mono); font-size: 12px; color: var(--muted);
  background: var(--bg-soft); border: 1px solid var(--border);
  border-radius: 9px; padding: 9px 12px; word-break: break-all;
}
.resp-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 10px; }
.status {
  font-family: var(--mono); font-size: 12px; font-weight: 700;
  padding: 3px 9px; border-radius: 7px; border: 1px solid;
}
.status.ok { color: var(--ok); background: var(--post-bg); border-color: var(--post-br); }
.status.err { color: var(--err); background: var(--del-bg); border-color: var(--del-br); }
.resp-meta { font-size: 12px; color: var(--muted-2); }
pre.code {
  margin: 0; padding: 14px; border-radius: 11px; overflow: auto; max-height: 460px; max-width: 100%;
  background: var(--bg-soft); border: 1px solid var(--border);
  font-family: var(--mono); font-size: 12.5px; line-height: 1.55; color: var(--text-2);
  -webkit-overflow-scrolling: touch;
}
pre.code .k { color: var(--j-key); }
pre.code .s { color: var(--j-str); }
pre.code .n { color: var(--j-num); }
pre.code .b { color: var(--j-bool); }
pre.code .z { color: var(--j-null); }
.notice {
  font-size: 12px; color: var(--muted); background: var(--chip);
  border: 1px solid var(--border); border-radius: 9px; padding: 8px 11px; margin-bottom: 9px;
}
.schema-list { display: grid; gap: 6px; }
.schema-row {
  display: grid; grid-template-columns: minmax(140px, 200px) minmax(0, 1fr); gap: 12px;
  font-size: 12.5px; padding: 7px 0; border-bottom: 1px solid var(--border);
}
.schema-row:last-child { border-bottom: 0; }
.schema-row code { font-family: var(--mono); color: var(--text); }
.schema-row .ty { color: var(--muted-2); font-family: var(--mono); font-size: 11.5px; }
.schema-row span { color: var(--muted); }

.empty { text-align: center; color: var(--muted); padding: 60px 20px; }
.spin {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid var(--border); border-top-color: var(--accent);
  animation: sp .7s linear infinite; display: inline-block; vertical-align: -4px;
}
@keyframes sp { to { transform: rotate(360deg); } }
.footer {
  margin-top: 56px; padding-top: 22px; border-top: 1px solid var(--border);
  color: var(--muted-2); font-size: 12.5px;
  display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
}
.footer a { color: var(--muted); text-decoration: none; }
.footer a:hover { color: var(--text); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ========== планшет и телефон ========== */
@media (max-width: 760px) {
  main { padding: 30px 14px 72px; }
  h1 { font-size: 25px; }
  .intro-mark { width: 40px; height: 40px; }
  .topbar { padding: 10px 14px; gap: 9px; }
  .brand-name .dim { display: none; }
  .op-head { gap: 11px; padding: 13px 14px; flex-wrap: wrap; }
  .op-text { flex-basis: 100%; order: 3; }
  .chev { margin-left: auto; }
  .op-body { padding: 14px; gap: 17px; }
  .param-row { grid-template-columns: 1fr; gap: 5px; }
  .param-name { padding-top: 0; }
  .schema-row { grid-template-columns: 1fr; gap: 2px; }
  .actions .btn { flex: 1 1 auto; justify-content: center; }
  pre.code { max-height: 360px; font-size: 12px; }
}
@media (max-width: 400px) {
  .badge-ver { display: none; }
  .op-path { font-size: 12.5px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>

      server: 'Server',
      openapi: 'Spec',
      emptyBody: 'You may leave the body empty — {} will be sent',
      themeLabel: 'Toggle theme'
    }
  };

  var state = {
    spec: null,
    ops: [],
    lang: 'ru',
    tag: null,
    query: '',
    open: {}      // ключ операции -> открыта ли
  };

  var $ = function (sel, root) { return (root || document).querySelector(sel); };
  var T = function (key) { return (I18N[state.lang] && I18N[state.lang][key]) || I18N.ru[key] || key; };

  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // локализованное поле: у объекта может быть x-en с переводом
  function loc(obj, field) {
    if (!obj) return '';
    if (state.lang === 'en') {
      var en = obj['x-en'];
      if (en && en[field]) return en[field];
    }
    return obj[field] || '';
  }

  // ================== тема ==================
  var THEME_KEY = 'karapuz-theme';
  function systemTheme() {
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
  }
  function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
    applyTheme(saved === 'light' || saved === 'dark' ? saved : systemTheme());
  }

  // ================== язык ==================
  var LANG_KEY = 'karapuz-lang';
  function applyLang(lang) {
    state.lang = lang === 'en' ? 'en' : 'ru';
    try { localStorage.setItem(LANG_KEY, state.lang); } catch (e) {}
    document.documentElement.lang = state.lang;
    $('#lang-ru').setAttribute('aria-pressed', String(state.lang === 'ru'));
    $('#lang-en').setAttribute('aria-pressed', String(state.lang === 'en'));
    $('#theme-btn').setAttribute('aria-label', T('themeLabel'));
    var brand = document.querySelector('[data-i18n="brandApi"]');
    if (brand) brand.textContent = T('brandApi');
    var q = $('#q');
    q.placeholder = T('searchPh');
    $('#q-label').textContent = T('searchPh');
    renderIntro();
    renderTagFilter();
    renderGroups();
  }

  // ================== подсветка JSON ==================
  function highlight(json) {
    return esc(json).replace(
      /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false)\b|\bnull\b|-?\d+(?:\.\d+)?(?:[eE][+\-]?\d+)?)/g,
      function (m) {
        var cls = 'n';
        if (/^"/.test(m)) cls = /:$/.test(m) ? 'k' : 's';
        else if (/true|false/.test(m)) cls = 'b';
        else if (/null/.test(m)) cls = 'z';
        return '<span class="' + cls + '">' + m + '</span>';
      }
    );
  }

  function fmtBytes(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(2) + ' MB';
  }

  // ================== разбор спецификации ==================
  var METHODS = ['get', 'post', 'put', 'patch', 'delete'];

  function collectOps(spec) {
    var ops = [];
    Object.keys(spec.paths || {}).forEach(function (path) {
      METHODS.forEach(function (method) {
        var op = spec.paths[path][method];
        if (!op) return;
        ops.push({
          key: method + ':' + path,
          method: method,
          path: path,
          tag: (op.tags && op.tags[0]) || 'API',
          op: op
        });
      });
    });
    return ops;
  }

  // пример тела запроса из requestBody
  function bodyExample(op) {
    var rb = op.requestBody;
    if (!rb || !rb.content) return null;
    var media = rb.content['application/json'];
    if (!media) return null;
    if (media.example !== undefined) return JSON.stringify(media.example, null, 2);
    if (media.schema && media.schema.example !== undefined) return JSON.stringify(media.schema.example, null, 2);
    return '{\n  \n}';
  }

  function pathHtml(path) {
    return path.split('/').map(function (seg) {
      if (!seg) return '';
      if (/^\{.+\}$/.test(seg)) return '<span class="sl">/</span><span class="par">' + esc(seg) + '</span>';
      var cls = seg === 'api' ? '' : ' seg-b';
      return '<span class="sl">/</span><span class="' + cls.trim() + '">' + esc(seg) + '</span>';
    }).join('');
  }

  // ================== отрисовка ==================
  function renderIntro() {
    var spec = state.spec;
    if (!spec) return;
    var info = spec.info || {};
    var full = loc(info, 'title') || 'API';
    $('#api-title').textContent = full.split(/\s+[—–-]\s+/)[0];
    $('#api-desc').textContent = loc(info, 'description') || '';
    $('#ver').textContent = 'v' + (info.version || '1.0');
    document.title = 'Softclub · ' + T('brandApi');

    var server = (spec.servers && spec.servers[0] && spec.servers[0].url) || location.origin;
    $('#api-meta').innerHTML =
      '<span class="meta"><b>' + state.ops.length + '</b> ' + esc(T('endpoints')) + '</span>' +
      '<span class="meta">' + esc(T('server')) + ' <code>' + esc(server) + '</code></span>' +
      '<span class="meta">' + esc(T('openapi')) + ' <code>OpenAPI ' + esc(spec.openapi || '3.0') + '</code></span>';
    $('#foot-count').textContent = state.ops.length + ' ' + T('endpoints');
  }

  function renderTagFilter() {
    var spec = state.spec;
    if (!spec) return;
    var tags = (spec.tags || []).map(function (t) { return t.name; });
    state.ops.forEach(function (o) { if (tags.indexOf(o.tag) < 0) tags.push(o.tag); });

    var html = '<button type="button" data-tag="" aria-pressed="' + (state.tag ? 'false' : 'true') + '">' + esc(T('all')) + '</button>';
    html += tags.map(function (name) {
      return '<button type="button" data-tag="' + esc(name) + '" aria-pressed="' +
        (state.tag === name ? 'true' : 'false') + '">' + esc(name) + '</button>';
    }).join('');
    $('#tag-filter').innerHTML = html;
  }

  function matches(entry) {
    if (state.tag && entry.tag !== state.tag) return false;
    var q = state.query.trim().toLowerCase();
    if (!q) return true;
    var hay = (entry.method + ' ' + entry.path + ' ' + entry.tag + ' ' +
      loc(entry.op, 'summary') + ' ' + loc(entry.op, 'description')).toLowerCase();
    return hay.indexOf(q) >= 0;
  }

  function renderGroups() {
    var spec = state.spec;
    if (!spec) return;
    var visible = state.ops.filter(matches);
    var root = $('#groups');

    if (!visible.length) {
      root.innerHTML = '<div class="empty">' + esc(T('empty')) + '</div>';
      return;
    }

    var order = (spec.tags || []).map(function (t) { return t.name; });
    var byTag = {};
    visible.forEach(function (entry) {
      (byTag[entry.tag] = byTag[entry.tag] || []).push(entry);
    });
    var names = Object.keys(byTag).sort(function (a, b) {
      var ia = order.indexOf(a), ib = order.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });

    root.innerHTML = names.map(function (name) {
      var meta = (spec.tags || []).filter(function (t) { return t.name === name; })[0];
      return '<section class="tag-group">' +
        '<h2>' + esc(name) + '</h2>' +
        (meta ? '<p>' + esc(loc(meta, 'description')) + '</p>' : '') +
        '<div class="ops">' + byTag[name].map(opCard).join('') + '</div>' +
        '</section>';
    }).join('');

    // восстановить открытые карточки
    Object.keys(state.open).forEach(function (key) {
      if (!state.open[key]) return;
      var el = root.querySelector('[data-key="' + cssEscape(key) + '"]');
      if (el) expand(el, true);
    });
  }

  function cssEscape(v) { return String(v).replace(/["\\]/g, '\\$&'); }

  function opCard(entry) {
    var op = entry.op;
    return '<article class="op" data-key="' + esc(entry.key) + '" data-open="false">' +
      '<button type="button" class="op-head" aria-expanded="false">' +
        '<span class="method ' + entry.method + '">' + entry.method.toUpperCase() + '</span>' +
        '<span class="op-text">' +
          '<span class="op-path">' + pathHtml(entry.path) + '</span>' +
          '<span class="op-sum">' + esc(loc(op, 'summary')) + '</span>' +
        '</span>' +
        '<span class="chev" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>' +
      '</button>' +
    '</article>';
  }

  function paramField(p) {
    var schema = p.schema || {};
    var id = 'p-' + Math.random().toString(36).slice(2, 9);
    var attrs = 'class="field" data-name="' + esc(p.name) + '" data-in="' + esc(p.in) + '" id="' + id + '"';

    if (schema.enum && schema.enum.length) {
      return '<select ' + attrs + '>' +
        '<option value="">—</option>' +
        schema.enum.map(function (v) {
          var mark = schema.default === v ? ' — default' : '';
          return '<option value="' + esc(v) + '">' + esc(v) + esc(mark) + '</option>';
        }).join('') + '</select>';
    }
    if (schema.type === 'boolean') {
      return '<select ' + attrs + '><option value="">—</option><option value="true">true</option><option value="false">false</option></select>';
    }
    var type = schema.type === 'integer' || schema.type === 'number' ? 'number' : 'text';
    var ph = schema.default !== undefined ? String(schema.default) : (p.in === 'path' ? '1' : '');
    return '<input type="' + type + '" ' + attrs + ' placeholder="' + esc(ph) + '"' +
      (p.in === 'path' ? ' required' : '') + '>';
  }

  function responsesHtml(op) {
    var res = op.responses || {};
    var codes = Object.keys(res);
    if (!codes.length) return '';
    return '<div><div class="block-title">' + esc(T('responses')) + '</div><div class="schema-list">' +
      codes.map(function (code) {
        return '<div class="schema-row"><code>' + esc(code) + '</code><span>' +
          esc(loc(res[code], 'description')) + '</span></div>';
      }).join('') + '</div></div>';
  }

  function bodyHtml(entry) {
    var example = bodyExample(entry.op);
    if (example === null) return '';
    return '<div>' +
      '<div class="block-title">' + esc(T('body')) + '</div>' +
      '<textarea class="field js-body" spellcheck="false">' + esc(example) + '</textarea>' +
      '<div class="param-hint" style="margin-top:6px">' + esc(T('emptyBody')) + '</div>' +
      '</div>';
  }

  function paramsHtml(entry) {
    var params = entry.op.parameters || [];
    if (!params.length) return '<div><div class="block-title">' + esc(T('params')) + '</div>' +
      '<div class="param-hint">' + esc(T('noParams')) + '</div></div>';

    return '<div><div class="block-title">' + esc(T('params')) + '</div><div class="params">' +
      params.map(function (p) {
        var schema = p.schema || {};
        var meta = [p.in === 'path' ? T('inPath') : T('inQuery'), schema.type || 'string'];
        if (p.required) meta.push(T('required'));
        return '<div class="param-row">' +
          '<label class="param-name" for="">' + esc(p.name) +
            (p.required ? '<span class="req">*</span>' : '') +
            '<span class="param-meta">' + esc(meta.join(' · ')) + '</span>' +
          '</label>' +
          '<div class="param-input">' + paramField(p) +
            '<span class="param-hint">' + esc(loc(p, 'description')) + '</span>' +
          '</div>' +
        '</div>';
      }).join('') + '</div></div>';
  }

  function expand(card, silent) {
    var key = card.getAttribute('data-key');
    var entry = state.ops.filter(function (o) { return o.key === key; })[0];
    if (!entry) return;

    card.setAttribute('data-open', 'true');
    $('.op-head', card).setAttribute('aria-expanded', 'true');
    state.open[key] = true;
    if (card.querySelector('.op-body')) return;

    var desc = loc(entry.op, 'description');
    var body = document.createElement('div');
    body.className = 'op-body';
    body.innerHTML =
      (desc ? '<p class="op-desc">' + esc(desc) + '</p>' : '') +
      paramsHtml(entry) +
      bodyHtml(entry) +
      '<div class="actions">' +
        '<button type="button" class="btn btn-primary js-send">' + esc(T('send')) + '</button>' +
        '<button type="button" class="btn btn-ghost js-reset">' + esc(T('reset')) + '</button>' +
        '<button type="button" class="btn btn-ghost js-curl">' + esc(T('copyCurl')) + '</button>' +
        '<span class="hint-inline js-hint"></span>' +
      '</div>' +
      '<div class="js-result"></div>' +
      responsesHtml(entry.op);

    card.appendChild(body);

    $('.js-send', body).addEventListener('click', function () { send(entry, card); });
    $('.js-reset', body).addEventListener('click', function () { reset(card); });
    $('.js-curl', body).addEventListener('click', function () { copyCurl(entry, card); });
    if (!silent) card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function collapse(card) {
    card.setAttribute('data-open', 'false');
    $('.op-head', card).setAttribute('aria-expanded', 'false');
    state.open[card.getAttribute('data-key')] = false;
  }

  function reset(card) {
    Array.prototype.forEach.call(card.querySelectorAll('.field'), function (f) {
      if (f.tagName === 'TEXTAREA') return;
      f.value = '';
    });
    $('.js-result', card).innerHTML = '';
    $('.js-hint', card).textContent = '';
  }

  // ================== выполнение запроса ==================
  function buildRequest(entry, card) {
    var path = entry.path;
    var query = [];
    var missing = [];

    Array.prototype.forEach.call(card.querySelectorAll('.field[data-name]'), function (f) {
      var name = f.getAttribute('data-name');
      var where = f.getAttribute('data-in');
      var value = String(f.value || '').trim();
      if (where === 'path') {
        if (!value) { missing.push(name); value = f.placeholder || '1'; }
        path = path.replace('{' + name + '}', encodeURIComponent(value));
      } else if (value !== '') {
        query.push(encodeURIComponent(name) + '=' + encodeURIComponent(value));
      }
    });

    var url = location.origin + path + (query.length ? '?' + query.join('&') : '');
    var method = entry.method.toUpperCase();
    var bodyEl = card.querySelector('.js-body');
    var raw = bodyEl ? bodyEl.value.trim() : '';
    var hasBody = ['POST', 'PUT', 'PATCH'].indexOf(method) >= 0 && bodyEl;

    return { url: url, method: method, body: hasBody ? (raw || '{}') : null, missing: missing };
  }

  function send(entry, card) {
    var req = buildRequest(entry, card);
    var btn = $('.js-send', card);
    var out = $('.js-result', card);
    var hint = $('.js-hint', card);

    if (req.body) {
      try { JSON.parse(req.body); }
      catch (e) {
        out.innerHTML = '<div class="notice">JSON: ' + esc(e.message) + '</div>';
        return;
      }
    }

    btn.disabled = true;
    btn.textContent = T('sending');
    hint.textContent = '';
    out.innerHTML = '<div class="req-line">' + esc(req.method + ' ' + req.url) + '</div>';

    var init = { method: req.method, headers: {} };
    if (req.body) {
      init.headers['Content-Type'] = 'application/json';
      init.body = req.body;
    }

    var started = performance.now();
    fetch(req.url, init).then(function (res) {
      return res.text().then(function (text) { return { res: res, text: text }; });
    }).then(function (r) {
      var ms = Math.round(performance.now() - started);
      var size = new Blob([r.text]).size;
      var pretty, isJson = true;
      try { pretty = JSON.stringify(JSON.parse(r.text), null, 2); }
      catch (e) { pretty = r.text; isJson = false; }

      var truncated = pretty.length > 200000;
      if (truncated) pretty = pretty.slice(0, 200000) + '\n…';

      out.innerHTML =
        '<div class="req-line">' + esc(req.method + ' ' + req.url) + '</div>' +
        '<div style="margin-top:12px">' +
          '<div class="resp-head">' +
            '<span class="status ' + (r.res.ok ? 'ok' : 'err') + '">' + r.res.status + ' ' + esc(r.res.statusText || '') + '</span>' +
            '<span class="resp-meta">' + ms + ' ms · ' + fmtBytes(size) + '</span>' +
          '</div>' +
          (truncated ? '<div class="notice">' + esc(T('truncated')) + '</div>' : '') +
          (isJson ? '' : '<div class="notice">' + esc(T('notJson')) + '</div>') +
          '<pre class="code">' + (isJson ? highlight(pretty) : esc(pretty)) + '</pre>' +
        '</div>';
    }).catch(function (err) {
      out.innerHTML = '<div class="notice">' + esc(T('netError') + (err && err.message ? err.message : err)) + '</div>';
    }).then(function () {
      btn.disabled = false;
      btn.textContent = T('send');
    });
  }

  function copyCurl(entry, card) {
    var req = buildRequest(entry, card);
    var cmd = "curl -X " + req.method + " '" + req.url + "'";
    if (req.body) {
      cmd += " \\\n  -H 'Content-Type: application/json' \\\n  -d '" + req.body.replace(/'/g, "'\\''") + "'";
    }
    var hint = $('.js-hint', card);
    var done = function () { hint.textContent = T('copied'); setTimeout(function () { hint.textContent = ''; }, 1600); };

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(cmd).then(done, function () { fallbackCopy(cmd, done); });
    } else {
      fallbackCopy(cmd, done);
    }
  }

  function fallbackCopy(text, done) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    document.body.removeChild(ta);
  }

  // ================== события ==================
  document.addEventListener('click', function (e) {
    var head = e.target.closest && e.target.closest('.op-head');
    if (head) {
      var card = head.parentNode;
      if (card.getAttribute('data-open') === 'true') collapse(card);
      else expand(card);
      return;
    }
    var tagBtn = e.target.closest && e.target.closest('#tag-filter button');
    if (tagBtn) {
      var name = tagBtn.getAttribute('data-tag');
      state.tag = name || null;
      renderTagFilter();
      renderGroups();
    }
  });

  $('#q').addEventListener('input', function (e) {
    state.query = e.target.value;
    renderGroups();
  });

  $('#theme-btn').addEventListener('click', function () {
    var current = document.documentElement.getAttribute('data-theme');
    applyTheme(current === 'dark' ? 'light' : 'dark');
  });

  $('#lang-ru').addEventListener('click', function () { applyLang('ru'); });
  $('#lang-en').addEventListener('click', function () { applyLang('en'); });

  // ================== старт ==================
  initTheme();
  try {
    var savedLang = localStorage.getItem(LANG_KEY);
    if (savedLang === 'en') state.lang = 'en';
  } catch (e) {}

  fetch('/api/swagger.json', { headers: { Accept: 'application/json' } })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (spec) {
      state.spec = spec;
      state.ops = collectOps(spec);
      applyLang(state.lang);
    })
    .catch(function (err) {
      $('#api-desc').innerHTML = '<span class="notice">' + esc(T('loadError') + ': ' + (err && err.message)) + '</span>';
    });
})();
</script>
</body>
</html>
