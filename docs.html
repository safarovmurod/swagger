<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f4f8" media="(prefers-color-scheme: light)">
<meta name="description" content="Карапуз API — данные интернет-магазина детских товаров: категории, подкатегории, товары, акции и блог.">
<title>Softclub · Карапуз API</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="mask-icon" href="/favicon.svg" color="#2f5c88">
<style>
:root {
  --bg: #f2f4f8;
  --bg-2: #e8ebf2;
  --card: #ffffff;
  --card-2: #f7f9fc;
  --border: #dfe3ec;
  --border-2: #c9cfdd;
  --text: #14161c;
  --text-2: #3c4351;
  --muted: #69707f;
  --muted-2: #8b92a2;
  --chip: #eef1f7;
  --accent: #2f5c88;
  --accent-text: #ffffff;
  --shadow-1: 0 1px 2px rgba(20, 26, 40, .06);
  --shadow-2: 0 2px 6px rgba(20, 26, 40, .07), 0 12px 32px rgba(20, 26, 40, .07);
  --get: #1f5fd0; --get-bg: rgba(31, 95, 208, .1); --get-br: rgba(31, 95, 208, .26);
  --post: #12793a; --post-bg: rgba(18, 121, 58, .1); --post-br: rgba(18, 121, 58, .26);
  --put: #a35a08; --put-bg: rgba(163, 90, 8, .1); --put-br: rgba(163, 90, 8, .26);
  --del: #b4173c; --del-bg: rgba(180, 23, 60, .1); --del-br: rgba(180, 23, 60, .26);
  --ok: #12793a; --err: #b4173c;
  --j-key: #1f5fd0; --j-str: #12793a; --j-num: #a35a08; --j-bool: #6d3fbe; --j-null: #8b92a2;
  --tint: 8%;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
html[data-theme="dark"] {
  --bg: #0b0b0d;
  --bg-2: #121216;
  --card: #141417;
  --card-2: #1a1a1f;
  --border: #26262c;
  --border-2: #35353d;
  --text: #eeeef1;
  --text-2: #c5c6cd;
  --muted: #8d8e98;
  --muted-2: #6c6d77;
  --chip: #1d1d22;
  --accent: #74a8de;
  --accent-text: #0b0b0d;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .5);
  --shadow-2: 0 2px 8px rgba(0, 0, 0, .45), 0 16px 40px rgba(0, 0, 0, .3);
  --get: #7aa6f2; --get-bg: rgba(122, 166, 242, .13); --get-br: rgba(122, 166, 242, .3);
  --post: #5cbb7b; --post-bg: rgba(92, 187, 123, .13); --post-br: rgba(92, 187, 123, .3);
  --put: #ddaa5e; --put-bg: rgba(221, 170, 94, .13); --put-br: rgba(221, 170, 94, .3);
  --del: #e66c84; --del-bg: rgba(230, 108, 132, .13); --del-br: rgba(230, 108, 132, .3);
  --ok: #5cbb7b; --err: #e66c84;
  --j-key: #7aa6f2; --j-str: #5cbb7b; --j-num: #ddaa5e; --j-bool: #b492ea; --j-null: #8d8e98;
  --tint: 14%;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--sans); font-size: 14px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

/* ---------- шапка ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 12px; padding: 11px 20px;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: saturate(170%) blur(14px);
  -webkit-backdrop-filter: saturate(170%) blur(14px);
  border-bottom: 1px solid var(--border);
  animation: dropIn .5s cubic-bezier(.22, 1, .36, 1) both;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark {
  width: 31px; height: 31px; flex: none; border-radius: 9px;
  background: #2f5c88; color: #fff; display: grid; place-items: center;
  box-shadow: var(--shadow-1); transition: transform .35s cubic-bezier(.34, 1.56, .64, 1);
}
.brand:hover .brand-mark { transform: rotate(-8deg) scale(1.07); }
.brand-mark svg { width: 19px; height: 19px; display: block; }
.brand-name { font-weight: 650; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-name .dim { color: var(--muted); font-weight: 500; }
.badge-ver {
  font-family: var(--mono); font-size: 11px; padding: 2px 7px; border-radius: 6px; flex: none;
  background: var(--chip); color: var(--muted); border: 1px solid var(--border);
  transition: color .2s, border-color .2s;
}
.brand:hover .badge-ver { color: var(--text-2); border-color: var(--border-2); }
.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }

.seg { position: relative; display: flex; padding: 3px; border-radius: 10px; background: var(--chip); border: 1px solid var(--border); }
.seg .thumb {
  position: absolute; top: 3px; left: 3px; height: calc(100% - 6px); width: 40px;
  border-radius: 7px; background: var(--card); box-shadow: var(--shadow-1);
  transition: transform .28s cubic-bezier(.22, 1, .36, 1);
}
.seg button {
  position: relative; z-index: 1; width: 40px; border: 0; background: transparent;
  color: var(--muted); padding: 4px 0; border-radius: 7px; cursor: pointer;
  font-size: 12px; font-weight: 650; letter-spacing: .03em; transition: color .2s;
}
.seg button:hover { color: var(--text-2); }
.seg button[aria-pressed="true"] { color: var(--text); }
.icon-btn {
  width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px;
  border: 1px solid var(--border); background: var(--chip); color: var(--muted); cursor: pointer;
  transition: color .2s, border-color .2s, transform .3s cubic-bezier(.34, 1.56, .64, 1);
}
.icon-btn:hover { color: var(--text); border-color: var(--border-2); transform: rotate(18deg); }
.icon-btn svg { width: 17px; height: 17px; }
html[data-theme="dark"] .i-sun { display: none; }
html:not([data-theme="dark"]) .i-moon { display: none; }

/* ---------- герой ---------- */
main { max-width: 960px; margin: 0 auto; padding: 40px 20px 100px; }
.hero { display: flex; align-items: center; gap: 15px; }
.hero-mark {
  width: 50px; height: 50px; flex: none; border-radius: 15px;
  background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow-2);
  display: grid; place-items: center; color: var(--accent);
  animation: pop .6s cubic-bezier(.34, 1.56, .64, 1) .12s both;
}
.hero-mark svg { width: 30px; height: 30px; }
.hero h1 {
  margin: 0; font-size: 31px; line-height: 1.15; letter-spacing: -.028em; font-weight: 700;
  animation: slideUp .55s cubic-bezier(.22, 1, .36, 1) .18s both;
}
.hero-sub {
  margin: 12px 0 0; color: var(--muted); font-size: 14.5px;
  animation: slideUp .55s cubic-bezier(.22, 1, .36, 1) .26s both;
}
.hero-sub code { font-family: var(--mono); font-size: 13px; color: var(--text-2); }

/* ---------- секция ---------- */
.section { margin-top: 40px; animation: slideUp .5s cubic-bezier(.22, 1, .36, 1) both; }
.section-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
.section-head h2 { margin: 0; font-size: 19px; letter-spacing: -.02em; font-weight: 680; }
.section-head span { color: var(--muted-2); font-size: 12.5px; }
.stack { display: flex; flex-direction: column; gap: 10px; }

/* ---------- блок категории ---------- */
.cat {
  --cat: var(--accent);
  border: 1px solid var(--border); border-radius: 14px; background: var(--card);
  overflow: hidden; box-shadow: var(--shadow-1);
  opacity: 0; transform: translateY(14px);
  transition: border-color .2s, box-shadow .25s, transform .5s cubic-bezier(.22, 1, .36, 1), opacity .5s;
}
.cat.in { opacity: 1; transform: none; }
.cat:hover { border-color: color-mix(in srgb, var(--cat) 42%, var(--border)); box-shadow: var(--shadow-2); }
.cat[data-open="true"] { border-color: color-mix(in srgb, var(--cat) 46%, var(--border)); box-shadow: var(--shadow-2); }
.cat-head {
  width: 100%; display: flex; align-items: center; gap: 13px; padding: 16px 18px;
  background: none; border: 0; cursor: pointer; text-align: left;
  transition: background .2s;
}
.cat-head:hover { background: color-mix(in srgb, var(--cat) var(--tint), transparent); }
.cat[data-open="true"] .cat-head { background: color-mix(in srgb, var(--cat) var(--tint), transparent); }
.cat-dot {
  width: 34px; height: 34px; flex: none; border-radius: 11px; display: grid; place-items: center;
  background: color-mix(in srgb, var(--cat) 16%, transparent);
  border: 1px solid color-mix(in srgb, var(--cat) 34%, transparent);
  color: var(--cat); transition: transform .3s cubic-bezier(.34, 1.56, .64, 1);
}
.cat-head:hover .cat-dot { transform: scale(1.09); }
.cat-dot svg { width: 19px; height: 19px; }
.cat-title { min-width: 0; flex: 1; }
.cat-title b { display: block; font-size: 17px; font-weight: 660; letter-spacing: -.015em; }
.cat-title span { display: block; margin-top: 2px; color: var(--muted); font-size: 12.5px; }
.cat-count {
  flex: none; font-family: var(--mono); font-size: 11.5px; padding: 3px 9px; border-radius: 7px;
  background: var(--chip); color: var(--muted); border: 1px solid var(--border);
}
.cat-chev { flex: none; color: var(--muted-2); display: grid; place-items: center; transition: transform .3s cubic-bezier(.22, 1, .36, 1), color .2s; }
.cat-head:hover .cat-chev { color: var(--cat); }
.cat-chev svg { width: 17px; height: 17px; display: block; }
.cat[data-open="true"] .cat-chev { transform: rotate(90deg); color: var(--cat); }
.cat-body { border-top: 1px solid var(--border); padding: 4px 12px 12px; display: grid; gap: 8px; }
/* display:grid перебивает атрибут hidden — без этого блок не закрывается */
.cat-body[hidden], [hidden] { display: none !important; }
.cat[data-open="true"] > .cat-body { animation: slideUp .28s cubic-bezier(.22, 1, .36, 1) both; }
.cat-note {
  margin: 12px 6px 4px; padding: 11px 13px; border-radius: 10px; font-size: 13px; color: var(--text-2);
  background: color-mix(in srgb, var(--cat) calc(var(--tint) - 2%), var(--card-2));
  border: 1px solid color-mix(in srgb, var(--cat) 20%, var(--border));
}

/* ---------- строка запроса ---------- */
.req {
  border: 1px solid var(--border); border-radius: 12px; background: var(--card-2);
  padding: 13px 14px; display: grid; gap: 11px; min-width: 0;
  transition: border-color .2s, background .2s;
}
.req:hover { border-color: var(--border-2); }
.req-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.m {
  flex: none; min-width: 58px; text-align: center; font-family: var(--mono);
  font-size: 10.5px; font-weight: 700; letter-spacing: .07em;
  padding: 4px 8px; border-radius: 7px; border: 1px solid;
}
.m.get { color: var(--get); background: var(--get-bg); border-color: var(--get-br); }
.m.post { color: var(--post); background: var(--post-bg); border-color: var(--post-br); }
.m.put { color: var(--put); background: var(--put-bg); border-color: var(--put-br); }
.m.patch { color: var(--j-bool); background: color-mix(in srgb, var(--j-bool) 12%, transparent); border-color: color-mix(in srgb, var(--j-bool) 28%, transparent); }
.m.delete { color: var(--del); background: var(--del-bg); border-color: var(--del-br); }
.req-name { font-size: 14.5px; font-weight: 650; letter-spacing: -.01em; }
.req-desc { font-size: 12.5px; color: var(--muted); margin-top: -4px; }

.url-row { display: flex; gap: 8px; align-items: stretch; min-width: 0; }
.url {
  flex: 1; min-width: 0; font-family: var(--mono); font-size: 12px; color: var(--text-2);
  background: var(--bg-2); border: 1px solid var(--border); border-radius: 9px;
  padding: 9px 11px; overflow-wrap: anywhere;
}
.url .host { color: var(--muted-2); }
.url .qs { color: var(--accent); }
.mini {
  flex: none; border: 1px solid var(--border); background: var(--card); color: var(--muted);
  border-radius: 9px; padding: 0 12px; cursor: pointer; font-size: 12.5px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px;
  transition: color .2s, border-color .2s, transform .12s;
}
.mini:hover { color: var(--text); border-color: var(--border-2); }
.mini:active { transform: scale(.97); }
.mini svg { width: 14px; height: 14px; }

.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.ctl { display: grid; gap: 4px; min-width: 0; }
.ctl > label { font-size: 11px; color: var(--muted-2); letter-spacing: .02em; padding-left: 2px; }
.ctl input, .ctl select {
  border: 1px solid var(--border); background: var(--card); border-radius: 9px;
  padding: 7px 10px; font-size: 12.5px; outline: none; min-width: 0;
  transition: border-color .18s, box-shadow .18s;
}
.ctl input { font-family: var(--mono); }
.ctl input:focus, .ctl select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
.ctl input::placeholder { color: var(--muted-2); }
.ctl.w-sm input, .ctl.w-sm select { width: 92px; }
.ctl.w-md input, .ctl.w-md select { width: 140px; }
.ctl.w-lg { flex: 1 1 190px; }
.ctl.w-lg input { width: 100%; }
.check {
  display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-2);
  padding: 8px 11px; border: 1px solid var(--border); border-radius: 9px; background: var(--card);
  cursor: pointer; user-select: none; transition: border-color .18s, color .18s;
}
.check:hover { border-color: var(--border-2); }
.check input { width: 15px; height: 15px; accent-color: var(--accent); margin: 0; cursor: pointer; }

.btn {
  border: 1px solid transparent; border-radius: 10px; padding: 8px 16px;
  font-size: 13px; font-weight: 650; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  transition: filter .18s, transform .12s, border-color .18s, background .18s;
}
.btn:active { transform: scale(.97); }
.btn-go { background: var(--cat, var(--accent)); color: #fff; }
.btn-go:hover { filter: brightness(1.09); }
.btn-ghost { background: var(--card); border-color: var(--border); color: var(--text-2); }
.btn-ghost:hover { border-color: var(--border-2); color: var(--text); }
.btn[disabled] { opacity: .6; cursor: progress; }
.hint { font-size: 12px; color: var(--muted-2); }

.out { display: grid; gap: 8px; }
.out-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.st { font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 7px; border: 1px solid; }
.st.ok { color: var(--ok); background: var(--post-bg); border-color: var(--post-br); }
.st.err { color: var(--err); background: var(--del-bg); border-color: var(--del-br); }
.st-meta { font-size: 12px; color: var(--muted-2); }
pre.json {
  margin: 0; padding: 13px; border-radius: 10px; overflow: auto; max-height: 340px; max-width: 100%;
  background: var(--bg-2); border: 1px solid var(--border);
  font-family: var(--mono); font-size: 12px; line-height: 1.55; color: var(--text-2);
  -webkit-overflow-scrolling: touch;
  animation: fadeIn .3s ease both;
}
pre.json .k { color: var(--j-key); } pre.json .s { color: var(--j-str); }
pre.json .n { color: var(--j-num); } pre.json .b { color: var(--j-bool); } pre.json .z { color: var(--j-null); }
.note {
  font-size: 12px; color: var(--muted); background: var(--chip);
  border: 1px solid var(--border); border-radius: 9px; padding: 8px 11px;
}

/* ---------- форма создания ---------- */
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 11px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field > label { font-size: 11.5px; color: var(--muted); letter-spacing: .02em; }
.field > label .req-star { color: var(--del); }
.field input, .field select, .field textarea {
  border: 1px solid var(--border); background: var(--card); border-radius: 9px;
  padding: 9px 11px; font-size: 13px; outline: none; width: 100%;
  transition: border-color .18s, box-shadow .18s;
}
.field textarea { min-height: 72px; resize: vertical; font-family: inherit; }
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
}
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.mode { display: flex; gap: 6px; flex-wrap: wrap; }
.mode button {
  border: 1px solid var(--border); background: var(--card); color: var(--muted);
  padding: 7px 15px; border-radius: 9px; cursor: pointer; font-size: 12.5px; font-weight: 650;
  transition: color .18s, border-color .18s, background .18s, transform .12s;
}
.mode button:hover { color: var(--text); }
.mode button:active { transform: scale(.97); }
.mode button[aria-pressed="true"] { color: var(--text); border-color: var(--border-2); background: var(--chip); }
.mode button[data-m="post"][aria-pressed="true"] { color: var(--post); border-color: var(--post-br); background: var(--post-bg); }
.mode button[data-m="put"][aria-pressed="true"] { color: var(--put); border-color: var(--put-br); background: var(--put-bg); }
.mode button[data-m="patch"][aria-pressed="true"] { color: var(--j-bool); border-color: color-mix(in srgb, var(--j-bool) 30%, transparent); background: color-mix(in srgb, var(--j-bool) 12%, transparent); }
.mode button[data-m="delete"][aria-pressed="true"] { color: var(--del); border-color: var(--del-br); background: var(--del-bg); }

/* ---------- аккаунт ---------- */
.file-note { font-size: 11.5px; color: var(--muted-2); }

/* ---------- справка ---------- */
.faq { display: grid; gap: 14px; padding: 8px 2px 4px; }
.faq h4 { margin: 0; font-size: 13px; font-weight: 680; letter-spacing: -.01em; color: var(--text); }
.faq-group { display: grid; gap: 7px; }
.faq-row { display: grid; grid-template-columns: minmax(0, 168px) minmax(0, 1fr); gap: 12px; align-items: baseline; }
.faq-row .t { font-family: var(--mono); font-size: 12px; color: var(--accent); overflow-wrap: anywhere; }
.faq-row .d { font-size: 12.5px; color: var(--muted); }
@media (max-width: 640px) {
  .faq-row { grid-template-columns: minmax(0, 1fr); gap: 2px; }
}

.footer {
  margin-top: 54px; padding-top: 20px; border-top: 1px solid var(--border);
  color: var(--muted-2); font-size: 12.5px; display: flex; gap: 16px; flex-wrap: wrap;
}
.footer a { color: var(--muted); text-decoration: none; transition: color .18s; }
.footer a:hover { color: var(--text); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.spin { width: 17px; height: 17px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--accent); animation: sp .7s linear infinite; display: inline-block; vertical-align: -4px; }

@keyframes sp { to { transform: rotate(360deg); } }
@keyframes dropIn { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: none; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { opacity: 0; transform: scale(.6) rotate(-12deg); } 100% { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

@media (max-width: 760px) {
  main { padding: 28px 13px 76px; }
  .topbar { padding: 10px 13px; gap: 9px; }
  .brand-name .dim { display: none; }
  .hero h1 { font-size: 25px; }
  .hero-mark { width: 44px; height: 44px; }
  .cat-head { padding: 13px 14px; gap: 11px; }
  .cat-title b { font-size: 15.5px; }
  .cat-count { display: none; }
  .cat-body { padding: 4px 9px 10px; }
  .req { padding: 11px 12px; }
  .ctl.w-sm input, .ctl.w-sm select, .ctl.w-md input, .ctl.w-md select { width: 100%; }
  .ctl.w-sm, .ctl.w-md { flex: 1 1 120px; }
  .controls .btn { flex: 1 1 100%; }
  pre.json { max-height: 280px; font-size: 11.5px; }
}
@media (max-width: 400px) { .badge-ver { display: none; } }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
  .cat { opacity: 1; transform: none; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">

      if (v) qs.push(encodeURIComponent(name) + '=' + encodeURIComponent(v));
    });
    return location.origin + base + (qs.length ? '?' + qs.join('&') : '');

    var host = location.origin;
    $('.js-url', req).innerHTML =
      '<span class="host">' + esc(host) + '</span>' + esc(head.slice(host.length)) +
      (tail ? '<span class="qs">' + esc(decodeURIComponent(tail)) + '</span>' : '');
  }

  function runGet(req) {
    var url = buildUrl(req);
    var out = $('.js-out', req);
    var btn = $('.js-send', req);
    btn.disabled = true;
    btn.textContent = T('sending');
    var t0 = performance.now();
    fetch(url, { headers: authHeaders({ Accept: 'application/json' }) })
      .then(function (r) { return r.text().then(function (t) { return { r: r, t: t }; }); })
      .then(function (x) { showOut(out, x.r, x.t, Math.round(performance.now() - t0)); })
      .catch(function (e) { out.innerHTML = '<div class="note">' + esc(T('netErr') + (e && e.message ? e.message : e)) + '</div>'; })
      .then(function () { btn.disabled = false; btn.textContent = T('send'); });
  }

  function showOut(out, res, text, ms) {
    var size = new Blob([text]).size;
    var pretty, isJson = true;
    try { pretty = JSON.stringify(JSON.parse(text), null, 2); }
    catch (e) { pretty = text; isJson = false; }
    var cut = pretty.length > 200000;
    if (cut) pretty = pretty.slice(0, 200000) + '\n…';
    out.innerHTML =
      '<div class="out-head">' +
        '<span class="st ' + (res.ok ? 'ok' : 'err') + '">' + res.status + ' ' + esc(res.statusText || '') + '</span>' +
        '<span class="st-meta">' + ms + ' ms · ' + fmtBytes(size) + '</span>' +
      '</div>' +
      (cut ? '<div class="note">' + esc(T('big')) + '</div>' : '') +
      (isJson ? '' : '<div class="note">' + esc(T('notJson')) + '</div>') +
      '<pre class="json">' + (isJson ? highlight(pretty) : esc(pretty)) + '</pre>';
  }

  function copyText(text, btn) {
    var label = $('.js-copy-t', btn);
    var old = label.textContent;
    var done = function () { label.textContent = T('copied'); setTimeout(function () { label.textContent = old; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallback(text, done); });
    } else fallback(text, done);
  }
  function fallback(text, done) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    document.body.removeChild(ta);
  }

  // Один запрос из раздела аккаунта — ответ показывается так же, как везде
  function sendAuth(btn, outSel, url, init) {
    var out = $(outSel);
    var old = btn.textContent;
    btn.disabled = true;
    btn.textContent = T('sending');
    var t0 = performance.now();
    return fetch(url, init)
      .then(function (r) { return r.text().then(function (t) { return { r: r, t: t }; }); })
      .then(function (x) {
        showOut(out, x.r, x.t, Math.round(performance.now() - t0));
        try { return JSON.parse(x.t); } catch (e) { return null; }
      })
      .catch(function (e) {
        out.innerHTML = '<div class="note">' + esc(T('netErr') + (e && e.message ? e.message : e)) + '</div>';
        return null;
      })
      .then(function (payload) { btn.disabled = false; btn.textContent = old; return payload; });
  }

  function initAuth() {
    // FormData — тот же multipart/form-data, что и в Swagger: границы
    // расставляет браузер, свой Content-Type ставить нельзя
    function formOf(prefix, keys) {
      var form = new FormData();
      keys.forEach(function (key) {
        var el = $('#' + prefix + '-' + key);
        if (el && el.value) form.append(key, key === 'password' ? el.value : el.value.trim());
      });
      var file = $('#' + prefix + '-avatar').files[0];
      if (file) form.append('avatar', file, file.name);
      return form;
    }

    $('#reg-send').addEventListener('click', function () {
      var form = formOf('reg', ['fullName', 'tel', 'email', 'password', 'address']);
      sendAuth(this, '#reg-out', location.origin + '/api/users', { method: 'POST', body: form })
        .then(function (payload) {
          // выданный id сразу подставляем в «Личные данные» — так удобнее
          var d = payload && payload.data && payload.data.user;
          if (d) state.token = payload.data.token;
          if (d && d.id) { $('#pro-id').value = d.id; paintProfileUrl(); }
        });
    });

    $('#login-send').addEventListener('click', function () {
      var credentials = $('#login-email').value.trim() + ':' + $('#login-password').value;
      var bytes = new TextEncoder().encode(credentials);
      var encoded = btoa(Array.from(bytes, function (byte) { return String.fromCharCode(byte); }).join(''));
      sendAuth(this, '#login-out', location.origin + '/api/users/login', {
        method: 'GET', headers: { Authorization: 'Basic ' + encoded }
      }).then(function (payload) {
        if (!payload || !payload.data) return;
        state.token = payload.data.token;
        var user = payload.data.user;
        $('#pro-id').value = user.id;
        ['fullName', 'tel', 'address'].forEach(function (key) { $('#pro-' + key).value = user[key]; });
        $('#login-password').value = '';
        paintProfileUrl();
      });
    });

    $('#reg-clear').addEventListener('click', function () {
      ['fullName', 'tel', 'email', 'password', 'address', 'avatar'].forEach(function (key) {
        var el = $('#reg-' + key);
        if (el) el.value = '';
      });
      $('#reg-out').innerHTML = '';
    });

    function profileUrl() {
      var id = String($('#pro-id').value || '').trim();
      return location.origin + '/api/users' + (id ? '/' + encodeURIComponent(id) : '');
    }
    function paintProfileUrl() {
      var url = profileUrl();
      $('#pro-url').innerHTML = '<span class="host">' + esc(location.origin) + '</span>' +
        esc(url.slice(location.origin.length));
    }
    $('#pro-id').addEventListener('input', paintProfileUrl);
    paintProfileUrl();

    $('#pro-save').addEventListener('click', function () {
      var form = formOf('pro', ['fullName', 'tel', 'address']);
      sendAuth(this, '#pro-out', profileUrl(), { method: 'POST', body: form, headers: authHeaders() });
    });

    $('#pro-delete').addEventListener('click', function () {
      if (!String($('#pro-id').value || '').trim()) {
        $('#pro-out').innerHTML = '<div class="note">' + esc(T('needId')) + '</div>';
        return;
      }
      sendAuth(this, '#pro-out', profileUrl(), { method: 'DELETE', headers: authHeaders() });
    });
  }

      '<button type="button" class="cat-head" aria-expanded="false">' +
        '<span class="cat-dot" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l3 3v15H5z"/><path d="M9 9h7M9 13h7M9 17h4"/></svg></span>' +
        '<span class="cat-title"><b>' + esc(T('blogList')) + '</b><span>/api/blog</span></span>' +
        '<span class="cat-count">2 GET</span>' +
        '<span class="cat-chev" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>' +
      '</button>' +
      '<div class="cat-body" hidden>' +
        reqHtml({ base: '/api/blog', kind: 'blog', name: T('blogList') }) +
        reqHtml({ base: '/api/blog/{id}', kind: 'one', name: T('blogOne'),
                  idParam: 'id', idLabel: 'id / slug', idExample: 'kak-vybrat-krovatku' }) +
      '</div></article>';

    return promo + blog;
  }

  /* ---------- форма создания / изменения / удаления ---------- */
  var SECTIONS = {
    product: {
      label: 'secProduct', path: '/api/products', idExample: '1',
      fields: [
        ['name', 'fName', 'text', true], ['price', 'fPrice', 'number', true],
        ['oldPrice', 'fOldPrice', 'number'], ['categoryId', 'fCategory', 'category'],
        ['subcategoryId', 'fSubcategory', 'subcategory'], ['brand', 'fBrand', 'text'],
        ['country', 'fCountry', 'text'], ['image', 'fImage', 'text'],
        ['ageGroup', 'fAge', 'text'], ['description', 'fDescription', 'area']
      ],
      checks: [['inStock', 'cInStock', true], ['isNew', 'cIsNew', false], ['isPromo', 'cIsPromo', false]]
    },
    category: {
      label: 'secCategory', path: '/api/categories', idExample: 'kolyaski',
      fields: [['name', 'fName', 'text', true], ['slug', 'fSlug', 'text'], ['image', 'fImage', 'text'],
               ['description', 'fDescription', 'area']],
      checks: []
    },
    subcategory: {
      label: 'secSubcategory', path: '/api/subcategories', idExample: '21',
      fields: [['name', 'fName', 'text', true], ['slug', 'fSlug', 'text'], ['categoryId', 'fCategory', 'category']],
      checks: []
    },
    promotion: {
      label: 'secPromotion', path: '/api/promotions', idExample: 'akciya-kolyaski',
      fields: [['title', 'fTitle', 'text', true], ['description', 'fExcerpt', 'text'],
               ['discount', 'fDiscount', 'number'], ['categoryId', 'fCategory', 'category'],
               ['dateStart', 'fDateStart', 'date'], ['dateEnd', 'fDateEnd', 'date'],
               ['image', 'fImage', 'text'], ['content', 'fContent', 'area']],
      checks: [['isActive', 'cIsActive', true]]
    },
    blog: {
      label: 'secBlog', path: '/api/blog', idExample: 'kak-vybrat-krovatku',
      fields: [['title', 'fTitle', 'text', true], ['slug', 'fSlug', 'text'],
               ['excerpt', 'fExcerpt', 'text'], ['date', 'fDateStart', 'date'],
               ['readingTime', 'fReading', 'number'], ['categoryId', 'fCategory', 'category'],
               ['image', 'fImage', 'text'], ['content', 'fContent', 'area']],
      checks: []
    },
    review: {
      label: 'secReview', path: '/api/products/{pid}/reviews', idExample: '1', onlyPost: true,
      fields: [['__pid', 'fProductId', 'number', true], ['author', 'fAuthor', 'text', true],
               ['rating', 'fRating', 'number'], ['pros', 'fPros', 'text'],
               ['cons', 'fCons', 'text'], ['comment', 'fComment', 'area', true]],
      checks: []
    }
  };

  function crudHtml() {
    var opts = Object.keys(SECTIONS).map(function (k) {
      return '<option value="' + k + '">' + esc(T(SECTIONS[k].label)) + '</option>';
    }).join('');
    return '<article class="cat" data-open="true" style="--cat:#6f7a8c">' +
      '<div class="cat-body" style="border-top:0;padding:16px">' +
        '<div class="form-grid" style="margin-bottom:12px">' +
          '<div class="field"><label>' + esc(T('section')) + '</label>' +
            '<select id="crud-section">' + opts + '</select></div>' +
          '<div class="field"><label>' + esc(T('action')) + '</label>' +
            '<div class="mode" id="crud-mode">' +
              '<button type="button" data-m="post" aria-pressed="true">POST</button>' +
              '<button type="button" data-m="put" aria-pressed="false">PUT</button>' +
              '<button type="button" data-m="patch" aria-pressed="false">PATCH</button>' +
              '<button type="button" data-m="delete" aria-pressed="false">DELETE</button>' +
            '</div></div>' +
          '<div class="field" id="crud-id-wrap" hidden><label>' + esc(T('idOf')) + ' <span class="req-star">*</span></label>' +
            '<input type="text" id="crud-id" placeholder="1"></div>' +
        '</div>' +
        '<div class="note" style="margin-bottom:11px">' + esc(T('crudAuthNote')) + '</div>' +
        '<div class="form-grid" id="crud-fields"></div>' +
        '<div class="checks" id="crud-checks" style="margin-top:11px"></div>' +
        '<div class="url-row" style="margin-top:13px">' +
          '<div class="url" id="crud-url"></div>' +
          '<button type="button" class="mini js-copy" id="crud-copy">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>' +
            '<span class="js-copy-t">' + esc(T('copy')) + '</span></button>' +
        '</div>' +
        '<div style="margin-top:11px" id="crud-body-wrap">' +
          '<div class="field"><label>' + esc(T('bodyPreview')) + '</label>' +
            '<pre class="json" id="crud-body" style="max-height:190px"></pre></div>' +
        '</div>' +
        '<div class="controls" style="margin-top:12px">' +
          '<button type="button" class="btn btn-go" id="crud-send">' + esc(T('send')) + '</button>' +
          '<button type="button" class="btn btn-ghost" id="crud-clear">' + esc(T('clear')) + '</button>' +
        '</div>' +
        '<div class="out" id="crud-out" style="margin-top:12px"></div>' +
      '</div>' +
    '</article>';
  }

  function initCrud() {
    var sectionSel = $('#crud-section');
    var mode = 'post';

    function subOptions(catId) {
      var cat = state.cats.filter(function (c) { return String(c.id) === String(catId); })[0];
      var list = cat ? (cat.subcategories || []) : [];
      return '<option value="">—</option>' + list.map(function (s) {
        return '<option value="' + s.id + '">' + esc(s.name) + '</option>';
      }).join('');
    }

    function fieldHtml(f) {
      var key = f[0], label = T(f[1]), type = f[2], required = f[3];
      var star = required ? ' <span class="req-star">*</span>' : '';
      var input;
      if (type === 'area') input = '<textarea data-f="' + key + '"></textarea>';
      else if (type === 'category') {
        input = '<select data-f="' + key + '"><option value="">—</option>' +
          state.cats.map(function (c) { return '<option value="' + c.id + '">' + esc(c.name) + '</option>'; }).join('') +
          '</select>';
      } else if (type === 'subcategory') {
        input = '<select data-f="' + key + '" id="crud-sub"><option value="">—</option></select>';
      } else if (type === 'date') input = '<input type="date" data-f="' + key + '">';
      else input = '<input type="' + (type === 'number' ? 'number' : 'text') + '" data-f="' + key + '">';
      return '<div class="field"><label>' + esc(label) + star + '</label>' + input + '</div>';
    }

    function paint() {
      var sec = SECTIONS[sectionSel.value];
      var needsId = mode !== 'post';
      $('#crud-id-wrap').hidden = !needsId;
      $('#crud-id').placeholder = sec.idExample;
      $('#crud-body-wrap').hidden = mode === 'delete';

      if (mode === 'delete') {
        $('#crud-fields').innerHTML = '';
        $('#crud-checks').innerHTML = '';
      } else {
        $('#crud-fields').innerHTML = sec.fields.map(fieldHtml).join('');
        $('#crud-checks').innerHTML = sec.checks.map(function (c) {
          return '<label class="check"><input type="checkbox" data-c="' + c[0] + '"' + (c[2] ? ' checked' : '') + '>' + esc(T(c[1])) + '</label>';
        }).join('');
        var catSel = $('#crud-fields [data-f="categoryId"]');
        var subSel = $('#crud-sub');
        if (catSel && subSel) {
          catSel.addEventListener('change', function () { subSel.innerHTML = subOptions(catSel.value); paintUrlAndBody(); });
        }
      }
      $$('#crud-fields [data-f], #crud-checks [data-c]').forEach(function (el) {
        el.addEventListener('input', paintUrlAndBody);
        el.addEventListener('change', paintUrlAndBody);
      });
      paintUrlAndBody();
    }

    function buildBody() {
      var body = {};
      $$('#crud-fields [data-f]').forEach(function (el) {
        var k = el.getAttribute('data-f');
        if (k === '__pid') return;
        var v = String(el.value || '').trim();
        if (!v) return;
        body[k] = el.type === 'number' ? Number(v) : v;
      });
      $$('#crud-checks [data-c]').forEach(function (el) { body[el.getAttribute('data-c')] = el.checked; });
      return body;
    }

    function buildCrudUrl() {
      var sec = SECTIONS[sectionSel.value];
      var path = sec.path;
      if (path.indexOf('{pid}') >= 0) {
        var pidEl = $('#crud-fields [data-f="__pid"]');
        var pid = pidEl && String(pidEl.value || '').trim() ? pidEl.value.trim() : '1';
        path = path.replace('{pid}', encodeURIComponent(pid));
      }
      if (mode !== 'post') {
        var id = String($('#crud-id').value || '').trim() || sec.idExample;
        path += '/' + encodeURIComponent(id);
      }
      return location.origin + path;
    }

    function paintUrlAndBody() {
      var url = buildCrudUrl();
      $('#crud-url').innerHTML = '<span class="host">' + esc(location.origin) + '</span>' +
        esc(url.slice(location.origin.length));
      if (mode !== 'delete') $('#crud-body').innerHTML = highlight(JSON.stringify(buildBody(), null, 2));
    }

    sectionSel.addEventListener('change', function () {
      var sec = SECTIONS[sectionSel.value];
      if (sec.onlyPost && mode !== 'post') { mode = 'post'; syncMode(); }
      paint();
    });
    $('#crud-id').addEventListener('input', paintUrlAndBody);

    function syncMode() {
      $$('#crud-mode button').forEach(function (b) {
        b.setAttribute('aria-pressed', String(b.getAttribute('data-m') === mode));
      });
    }
    $$('#crud-mode button').forEach(function (b) {
      b.addEventListener('click', function () {
        var sec = SECTIONS[sectionSel.value];
        if (sec.onlyPost && b.getAttribute('data-m') !== 'post') return;
        mode = b.getAttribute('data-m');
        syncMode();
        paint();
      });
    });

    $('#crud-copy').addEventListener('click', function () { copyText(buildCrudUrl(), this); });
    $('#crud-clear').addEventListener('click', function () {
      $$('#crud-fields [data-f]').forEach(function (el) { el.value = ''; });
      $('#crud-id').value = '';
      $('#crud-out').innerHTML = '';
      paintUrlAndBody();
    });

    $('#crud-send').addEventListener('click', function () {
      var sec = SECTIONS[sectionSel.value];
      var out = $('#crud-out');
      if (mode !== 'post' && !String($('#crud-id').value || '').trim()) {
        out.innerHTML = '<div class="note">' + esc(T('needId')) + '</div>';
        return;
      }
      if (mode === 'post' || mode === 'put') {
        var missing = sec.fields.filter(function (f) {
          if (!f[3]) return false;
          var el = $('#crud-fields [data-f="' + f[0] + '"]');
          return !el || !String(el.value || '').trim();
        });
        if (missing.length) { out.innerHTML = '<div class="note">' + esc(T('needName')) + '</div>'; return; }
      }
      var btn = this;
      btn.disabled = true;
      btn.textContent = T('sending');
      var init = { method: mode.toUpperCase(), headers: authHeaders({}) };
      if (mode !== 'delete') {
        init.headers['Content-Type'] = 'application/json';
        init.body = JSON.stringify(buildBody());
      }
      var t0 = performance.now();
      fetch(buildCrudUrl(), init)
        .then(function (r) { return r.text().then(function (t) { return { r: r, t: t }; }); })
        .then(function (x) { showOut(out, x.r, x.t, Math.round(performance.now() - t0)); })
        .catch(function (e) { out.innerHTML = '<div class="note">' + esc(T('netErr') + (e && e.message ? e.message : e)) + '</div>'; })
        .then(function () { btn.disabled = false; btn.textContent = T('send'); });
    });

    paint();
  }

  /* ---------- анимация появления ---------- */
  var io = null;
  function observe() {
    var items = $$('.cat');
    if (!('IntersectionObserver' in window)) { items.forEach(function (el) { el.classList.add('in'); }); return; }
    if (io) io.disconnect();
    io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e, i) {
        if (!e.isIntersecting) return;
        var el = e.target;
        el.style.transitionDelay = Math.min(i * 45, 240) + 'ms';
        el.classList.add('in');
        io.unobserve(el);
      });
    }, { rootMargin: '0px 0px -40px 0px', threshold: .05 });
    items.forEach(function (el) { io.observe(el); });
  }

  /* ---------- события ---------- */
  document.addEventListener('click', function (e) {
    var head = e.target.closest && e.target.closest('.cat-head');
    if (head) {
      var cat = head.parentNode;
      var open = cat.getAttribute('data-open') !== 'true';
      cat.setAttribute('data-open', String(open));
      head.setAttribute('aria-expanded', String(open));
      var body = $('.cat-body', cat);
      if (body) body.hidden = !open;
      var slug = cat.getAttribute('data-slug');
      if (slug) state.open[slug] = open;
      if (open) $$('.req', cat).forEach(paintUrl);
      return;
    }
    var copy = e.target.closest && e.target.closest('.req .js-copy');
    if (copy) { copyText(buildUrl(copy.closest('.req')), copy); return; }
    var send = e.target.closest && e.target.closest('.js-send');
    if (send) { runGet(send.closest('.req')); return; }
    var clear = e.target.closest && e.target.closest('.js-clear');
    if (clear) {
      var req = clear.closest('.req');
      $$('input, select', req).forEach(function (f) {
        if (f.type === 'checkbox') f.checked = false; else f.value = '';
      });
      $('.js-out', req).innerHTML = '';
      paintUrl(req);
    }
  });

  document.addEventListener('input', function (e) {
    var req = e.target.closest && e.target.closest('.req');
    if (req) paintUrl(req);
  });
  document.addEventListener('change', function (e) {
    var req = e.target.closest && e.target.closest('.req');
    if (req) paintUrl(req);
  });

  $('#theme-btn').addEventListener('click', function () {
    applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
  $('#lang-ru').addEventListener('click', function () { applyLang('ru'); });
  $('#lang-en').addEventListener('click', function () { applyLang('en'); });

  /* ---------- старт ---------- */
  initTheme();
  try { if (localStorage.getItem('karapuz-lang') === 'en') state.lang = 'en'; } catch (e) {}

  fetch('/api/categories?pageSize=50', { headers: { Accept: 'application/json' } })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) {
      state.cats = (data && (data.data || data.items)) || [];
      applyLang(state.lang);
    })
    .catch(function (err) {
      $('#hero-sub').innerHTML = '<span class="note">' + esc(T('loadErr') + ': ' + (err && err.message)) + '</span>';
    });
})();
</script>
</body>
</html>
